#FILE keck_dm_single.conf

# A single DM with Fried geometry.
dm.ht     = [0 0]   # DM conjugate to ground layer. (m)
dm.offset = [0 0]   # Fried geometry.

# Some common DM parameters that are usually the same for each DM. Can take either 1 or ndm values.
dm.dx     = [0.563 -1]  # spacing of DM actuators in meters on the primary.
dm.ar     = [1 1]      # DM aspect ratio. dy/dx spacing
dm.guard  = [1 0]      # extra DM actuator rings in actuator grid. default: 1

# Stroke numbers from Keck error budget spreadsheet, Stroke!E24, Stroke!E53
dm.stroke = [2.0 10]    # surface stroke in micron. opd is [-stroke stroke]
dm.iastroke=[1.20 10]   # surface inter-actuator stroke in micron or voltage 
dm.strokescale=[]    # describes polynomials that convert opd to voltage (first cell), and voltage to opd (second cell). The two operations has to be strict inverse of each other

dm.iac    = [0.223 0]  # inter-actuator-coupling coefficient for cubic influence function. 0: disable. 4/29/2019: updated from 0.3
dm.hist   = [0 0]      # output histogram of DM actuator commands.
dm.histbin= [1e-7 1e-7]   # The bin size for DM histogram computation.
dm.histn  = [201 201]    # Total number of bins. odd number, centered around zero.
dm.vmisreg= [0 0]      # vertical misregistration. not implemented yet.
dm.hyst   = [0 0]      # DM model hysteresis amount (ratio) 
dm.hyst_alpha=[2 2]    # The DM model hysteresis alpha parameter
dm.hyst_stroke=[10e-6 10e-6] # The surface stroke that the hysteresis is measured at
dm.actfloat = ["" ""]     # file containing floating actuators. nx2 coordinate
dm.actstuck = ["" ""]     # file containing stuck actuators. nx2 coordinate. or nx3 with third column the stuck position (in opd).
dm.dratio   = [1 1]     #telescope diameter to DM diameter ratio (beam angle magnification factor). Used to scale DM OPD correction.

# Set tip tilt or global control
dm.nmod = [0 2] # Zero means all modes, 2 means just tip/tilt